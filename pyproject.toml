[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vedex"
version = "0.1.0"
description = "A minimal terminal coding-agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.100.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.13.4",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["vedex"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["vedex", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["vedex", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
