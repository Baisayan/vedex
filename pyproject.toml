[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vedex"
version = "0.1.0"
description = "A minimal, provider-neutral terminal coding-agent harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.optional-dependencies]
openai = ["openai>=3.3.1,<4"]
gemini = ["google-genai>=2.19.0,<3"]

[project.urls]
Documentation = "https://twotimespi.dev"
Repository = "https://github.com/Baisayan/vedex"
Issues = "https://github.com/Baisayan/vedex/issues"

[project.scripts]
vedex = "vedex.cli:app"

[dependency-groups]
dev = [
    "google-genai>=2.19.0,<3",
    "mypy>=1.10",
    "openai>=3.3.1,<4",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["vedex"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["vedex", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["vedex", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
